[project]
name = "bionlp-sentence-classifier"
version = "1.0.0"
description = "Structure raw biomedical abstracts: label each sentence as BACKGROUND / OBJECTIVE / METHODS / RESULTS / CONCLUSIONS."
readme = "README.md"
license = "MIT"
authors = [{ name = "Zeineb Jemli" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.156.8",
    "joblib>=1.6.0",
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "scikit-learn>=1.9.1",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
bionlp = "bionlp.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bionlp"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "S", "PT", "RUF", "C4", "PL", "N"]
ignore = [
    "PLR0913", # sklearn-style constructors take many keyword arguments
    "PLR2004", # magic values are fine in tests and metric thresholds
    "N803",    # sklearn convention: X for feature matrices
    "N806",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S310", "S311", "PLC0415"]
"src/bionlp/api/app.py" = ["PLR0915"] # routes are closures inside the app factory
"src/bionlp/cli.py" = ["PLC0415"] # lazy imports keep `bionlp --help` fast
"experiments/**" = ["PLC0415"]    # heavy optional deps are imported lazily

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["bionlp"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
